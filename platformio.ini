; Meeting Recorder — ESP32-S3 firmware
; Nagrywanie audio z mikrofonu I2S + live stream przez WiFi (WebSocket) + zapis WAV na SD

[env:esp32-s3-devkitc1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; N8R8 / N16R8 — 8MB PSRAM, tryb OPI
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = default_8MB.csv

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    ESP32Async/ESPAsyncWebServer @ ^3.6.0
    ESP32Async/AsyncTCP @ ^3.3.2

; strona www (data/) wgrywana osobno: pio run --target uploadfs
board_build.filesystem = littlefs
